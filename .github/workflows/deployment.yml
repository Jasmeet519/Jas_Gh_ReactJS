name: Deploy Project
on: [push, workflow_dispatch]
jobs:
    test: 
        runs-on: ubuntu-latest
        steps:
            - name: Get the code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: 18
            - name: Install Dependencies
              run: npm ci
            - name: Run our tets
              run: npm test
    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get the code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
            - name: Install Dependencies
              run: npm ci
            - name: Build the project
              run: npm run build
            - name: Deploy
              run: echo "Deploying..."


    