name: Test Project
on: push
jobs:
    test: 
        runs-on: ubuntu-latest
        steps:
            - name: Get the code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: 18
            - name: Install Dependencies
              run: npm ci
            - name: Run our tets
              run: npm test